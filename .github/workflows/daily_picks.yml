name: NFL daily robot

on:
  schedule:
    - cron: "0 15 * * *"      # every day at 15:00 UTC (7 or 8 am Pacific)
  workflow_dispatch: {}        # lets you press "Run workflow" on GitHub to test it

permissions:
  contents: write              # needed so the robot can commit the picks and odds files

concurrency:
  group: nfl-daily-robot
  cancel-in-progress: false

jobs:
  save:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install requirements
        run: pip install -r requirements.txt

      - name: Save picks, take the odds snapshot, report the record
        run: python save_predictions.py nfl_dashboard_v2.py

      - name: Commit the data files if they changed
        run: |
          git config user.name "nfl-robot"
          git config user.email "actions@users.noreply.github.com"
          git add nfl_predictions.csv nfl_odds_history.csv
          if git diff --cached --quiet; then
            echo "Nothing new to commit."
          else
            git commit -m "Daily robot $(date -u +%Y-%m-%d)"
            git pull --rebase
            git push
          fi

  keep_awake:
    # Optional: add a repository variable named APP_URL (Settings > Secrets and variables > Actions > Variables) to turn this on.
    if: ${{ vars.APP_URL != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Visit the app
        env:
          APP_URL: ${{ vars.APP_URL }}
        run: |
          pip install playwright
          playwright install --with-deps chromium
          python wake_app.py
